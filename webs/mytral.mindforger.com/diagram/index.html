<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture - MyTraL</title>
    <meta name="description" content="How training data flows through MyTraL: from Strava, Polar, FIT/GPX/TCX and manual entry, through import and normalization, into activities, and out to the dashboard - or back out as an export.">
    <link rel="canonical" href="https://mytral.fitness/diagram/">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" href="../mytral-logo.png" type="image/png">
    <link rel="stylesheet" href="./diagram.css">
</head>
<body>

    <nav>
        <div class="container">
            <a href="../index.html" class="logo">
                <img src="../mytral-logo.png" alt="MyTraL">
                MyTraL
            </a>
            <a href="../index.html" class="back-link">&lt;- mytral.fitness</a>
        </div>
    </nav>

    <header class="hero container">
        <span class="eyebrow">architecture</span>
        <h1>MyTraL Overview</h1>
        <p><span class="hint">Click any block</span> to learn more.</p>
    </header>

    <main class="diagram-shell container">
        <div class="diagram" id="diagram">
            <svg class="connectors" id="connectors" aria-hidden="true"></svg>

            <div class="row-label">sources</div>
            <div class="row sources" id="row-sources">
                <button type="button" class="node" id="node-strava"
                        data-title="STRAVA"
                        data-detail="Activities and segments pulled live via the Strava API, or bulk-imported from a *.zip account export."
                        data-file="mytral/integrations/strava.py">
                    <span class="node-legend">strava</span>
                    <div class="badge-row">
                        <span class="badge">api</span>
                        <span class="badge">zip</span>
                    </div>
                </button>
                <button type="button" class="node" id="node-polar"
                        data-title="POLAR"
                        data-detail="Sessions and heart-rate data from Polar Flow - HRM and TCX exports."
                        data-file="mytral/integrations/polar_hrm.py">
                    <span class="node-legend">polar</span>
                    <div class="badge-row">
                        <span class="badge">api</span>
                        <span class="badge">zip</span>
                    </div>
                </button>
                <button type="button" class="node" id="node-fit"
                        data-title="FIT"
                        data-detail="Garmin / Wahoo *.fit recordings, parsed sample by sample."
                        data-file="mytral/recordings/fit_extractor.py">
                    <span class="node-legend">fit</span>
                    <div class="badge-row">
                        <span class="badge">file</span>
                    </div>
                </button>
                <button type="button" class="node" id="node-gpx"
                        data-title="GPX"
                        data-detail="GPS track *.gpx files - route, elevation, pace."
                        data-file="mytral/recordings/gpx_extractor.py">
                    <span class="node-legend">gpx</span>
                    <div class="badge-row">
                        <span class="badge">file</span>
                    </div>
                </button>
                <button type="button" class="node" id="node-tcx"
                        data-title="TCX"
                        data-detail="Training Center XML *.tcx recordings."
                        data-file="mytral/recordings/tcx_extractor.py">
                    <span class="node-legend">tcx</span>
                    <div class="badge-row">
                        <span class="badge">file</span>
                    </div>
                </button>
                <button type="button" class="node" id="node-manual"
                        data-title="MANUAL"
                        data-detail="Freeform entry straight from the web UI - any activity, any field, no file required."
                        data-file="mytral/forms.py">
                    <span class="node-legend">manual</span>
                    <div class="badge-row">
                        <span class="badge">ui</span>
                    </div>
                </button>
            </div>

            <div class="group group--mytral" id="group-mytral">
                <span class="group-legend">mytral</span>

                <div class="group group--import" id="group-import">
                    <span class="group-legend">import</span>
                    <div class="pipeline-row">
                        <button type="button" class="node pipeline-step" id="node-import-source"
                                data-title="SPORT DATA"
                                data-detail="Raw files and API payloads land exactly as the source sent them - *.zip, *.json, *.fit, *.gpx, *.tcx."
                                data-file="mytral/blueprints/import_uri_space.py">
                            <span class="node-label pipeline-label">SPORT DATA</span>
                        </button>
                        <div class="pipeline-arrow" aria-hidden="true"></div>
                        <button type="button" class="node pipeline-step" id="node-import-normalize"
                                data-title="NORMALIZATION"
                                data-detail="Every source format is converted into MyTraL's single internal activity shape."
                                data-file="mytral/blueprints/import_uri_space.py">
                            <span class="node-label pipeline-label">
                                <svg class="cog" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                                    <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"></circle>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor"></rect>
                                    <rect x="11" y="18" width="2" height="5" fill="currentColor"></rect>
                                    <rect x="1" y="11" width="5" height="2" fill="currentColor"></rect>
                                    <rect x="18" y="11" width="5" height="2" fill="currentColor"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(45 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(135 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(225 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(315 12 12)"></rect>
                                </svg>
                                NORMALIZATION
                            </span>
                        </button>
                        <div class="pipeline-arrow" aria-hidden="true"></div>
                        <button type="button" class="node pipeline-step" id="node-import-validate"
                                data-title="VALIDATION"
                                data-detail="Normalized activities are checked for missing fields, bad timestamps, and data problems."
                                data-file="mytral/blueprints/import_uri_space.py">
                            <span class="node-label pipeline-label">
                                <svg class="cog" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                                    <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"></circle>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor"></rect>
                                    <rect x="11" y="18" width="2" height="5" fill="currentColor"></rect>
                                    <rect x="1" y="11" width="5" height="2" fill="currentColor"></rect>
                                    <rect x="18" y="11" width="5" height="2" fill="currentColor"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(45 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(135 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(225 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(315 12 12)"></rect>
                                </svg>
                                VALIDATION
                            </span>
                        </button>
                        <div class="pipeline-arrow" aria-hidden="true"></div>
                        <button type="button" class="node pipeline-step" id="node-import-fixes"
                                data-title="FIXES"
                                data-detail="Known problems are auto-corrected before the activity is saved."
                                data-file="mytral/blueprints/import_uri_space.py">
                            <span class="node-label pipeline-label">
                                <svg class="cog" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                                    <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"></circle>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor"></rect>
                                    <rect x="11" y="18" width="2" height="5" fill="currentColor"></rect>
                                    <rect x="1" y="11" width="5" height="2" fill="currentColor"></rect>
                                    <rect x="18" y="11" width="5" height="2" fill="currentColor"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(45 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(135 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(225 12 12)"></rect>
                                    <rect x="11" y="1" width="2" height="5" fill="currentColor" transform="rotate(315 12 12)"></rect>
                                </svg>
                                FIXES
                            </span>
                        </button>
                    </div>
                </div>

                <button type="button" class="group group--activities interactive" id="group-activities"
                        data-title="ACTIVITIES"
                        data-detail="Run, Row, Ride, Swim, Ski, Gym, and custom types - stored as JSON + Parquet + GPX + photos."
                        data-file="mytral/backends/entities.py">
                    <span class="group-legend">activities</span>
                    <div class="badge-row">
                        <span class="badge badge-activity-type">run</span>
                        <span class="badge badge-activity-type">row</span>
                        <span class="badge badge-activity-type">ride</span>
                        <span class="badge badge-activity-type">swim</span>
                        <span class="badge badge-activity-type">ski</span>
                        <span class="badge badge-activity-type">gym</span>
                        <span class="badge badge-activity-type">physio</span>
                        <span class="badge badge-activity-type">...</span>
                    </div>
                    <hr class="activities-divider">
                    <div class="badge-row">
                        <span class="badge badge-file-type">.json</span>
                        <span class="badge badge-file-type">.parquet</span>
                        <span class="badge badge-file-type">.gpx</span>
                        <span class="badge badge-file-type">.png</span>
                    </div>
                </button>

                <div class="group group--ui" id="group-ui">
                <span class="group-legend">ui</span>
                <div class="ui-columns">
                    <button type="button" class="node" id="node-activities-ui"
                            data-title="ACTIVITIES"
                            data-detail="New entries, the activity feed, bookmarks, calendar, heatmap, charts, diary, and data validation."
                            data-file="mytral/routes.py">
                        <span class="node-label">ACTIVITIES</span>
                        <ul class="node-list">
                            <li>new</li>
                            <li>feed</li>
                            <li>bookmarks</li>
                            <li>calendar</li>
                            <li>heatmap</li>
                            <li>charts</li>
                            <li>diary</li>
                            <li>validation</li>
                        </ul>
                    </button>

                    <button type="button" class="node" id="node-insights-ui"
                            data-title="INSIGHTS"
                            data-detail="AI predictions, analytics, lifetime totals, and all-time stats per sport."
                            data-file="mytral/insights.py">
                        <span class="node-label">ANALYSIS&nbsp;&amp;&nbsp;INSIGHTS</span>
                        <ul class="node-list">
                            <li>predictions</li>
                            <li>analytics</li>
                            <li>lifetime totals</li>
                            <li>top sports</li>
                            <li>YOY trends</li>
                            <li>weekday heatmap</li>
                            <li>active in week</li>
                            <li>this vs last</li>
                        </ul>
                    </button>
                    <button type="button" class="node" id="node-health"
                            data-title="HEALTH"
                            data-detail="Body diagram for injuries and sickness, weight, resting HR, and a sickness heatmap."
                            data-file="mytral/insights.py">
                        <span class="node-label">HEALTH</span>
                        <ul class="node-list">
                            <li>me</li>
                            <li>weight</li>
                            <li>resting hr</li>
                            <li>sickness heatmap</li>
                        </ul>
                    </button>
                    <button type="button" class="node" id="node-progress"
                            data-title="PROGRESS"
                            data-detail="Fitness form (CTL / ATL / TSB), TRIMP training load, AI coaching, personal bests, paces, and races."
                            data-file="mytral/athlete_metrics.py">
                        <span class="node-label">PROGRESS</span>
                        <ul class="node-list">
                            <li>athlete metrics</li>
                            <li>trimp</li>
                            <li>ai coach chat</li>
                            <li>prs</li>
                            <li>paces</li>
                            <li>races</li>
                        </ul>
                    </button>
                    <button type="button" class="node" id="node-profile"
                            data-title="PROFILE"
                            data-detail="The entities behind every chart - AI coach settings, activity types, exercises, gear, goals, laps &amp; routes, outfits, and symptoms."
                            data-file="mytral/settings.py">
                        <span class="node-label">[ PROFILE ]</span>
                        <ul class="node-list">
                            <li>ai coaches</li>
                            <li>activity types</li>
                            <li>exercises</li>
                            <li>gear</li>
                            <li>goals</li>
                            <li>laps &amp; routes</li>
                            <li>outfits</li>
                            <li>symptoms</li>
                        </ul>
                    </button>
                </div>
                </div>

                <button type="button" class="group group--export interactive" id="group-export"
                        data-title="EXPORT"
                        data-detail="Take it all back out, any time - full *.zip backup or *.csv per activity."
                        data-file="mytral/blueprints/export_uri_space.py">
                    <span class="group-legend">export</span>
                    <div class="badge-row">
                        <span class="badge">zip</span>
                        <span class="badge">csv</span>
                    </div>
                </button>
            </div>

            <button type="button" class="group group--desktop interactive" id="group-desktop"
                    data-title="DESKTOP / SELF-HOSTED"
                    data-detail="One binary, your machine, your data - Linux, Windows, macOS."
                    data-file="mytral/run_desktop.py">
                <span class="group-legend">desktop / self-hosted</span>
                <div class="platform-columns">
                    <div class="platform-box">linux</div>
                    <div class="platform-box">windows</div>
                    <div class="platform-box">macos</div>
                </div>
            </button>
        </div>

        <div class="terminal-wrap">
            <div class="terminal">
                <div class="terminal-bar">
                    <span class="terminal-dot"></span>
                    <span class="terminal-title">Feature details - click any block to learn more</span>
                </div>
                <div class="terminal-body" id="terminal-body" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            Private, open-source, runs on your own machine. -
            <a href="../index.html">mytral.fitness</a>
        </div>
    </footer>

    <script>
        (function () {
            'use strict';

            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            /* ------------------------------------------------ terminal readout */

            var terminalBody = document.getElementById('terminal-body');
            var typeTimer = null;

            function renderLines(data) {
                var html = '<span class="ln-prompt">$ inspect ' + data.title + '</span>\n';
                html += '<span class="ln-out">&gt; ' + data.detail + '</span>\n';
                html += '<span class="ln-file">&gt; ' + data.file + '</span>';
                return html;
            }

            function typeToTerminal(data) {
                if (typeTimer) {
                    clearInterval(typeTimer);
                    typeTimer = null;
                }
                var full = renderLines(data);
                if (reduceMotion) {
                    terminalBody.innerHTML = full + '<span class="caret"></span>';
                    return;
                }
                var i = 0;
                terminalBody.innerHTML = '<span class="caret"></span>';
                typeTimer = setInterval(function () {
                    i += 2;
                    if (i >= full.length) {
                        terminalBody.innerHTML = full + '<span class="caret"></span>';
                        clearInterval(typeTimer);
                        typeTimer = null;
                        return;
                    }
                    terminalBody.innerHTML = full.slice(0, i) + '<span class="caret"></span>';
                }, 8);
            }

            /* ------------------------------------------------ node activation */

            var nodes = Array.prototype.slice.call(document.querySelectorAll('button[data-title]'));
            var clickable = nodes;

            function activate(node) {
                nodes.forEach(function (n) { n.classList.remove('active'); });
                node.classList.add('active');
                typeToTerminal({
                    title: node.dataset.title,
                    detail: node.dataset.detail,
                    file: node.dataset.file
                });
                pulseFrom(node.id);
            }

            clickable.forEach(function (node) {
                node.addEventListener('click', function () { activate(node); });
            });

            /* ------------------------------------------------ svg connectors */

            var svg = document.getElementById('connectors');
            var diagram = document.getElementById('diagram');
            var sourceIds = ['node-strava', 'node-polar', 'node-fit', 'node-gpx', 'node-tcx', 'node-manual'];

            var sportLetters = ['R', 'O', 'B', 'S']; // run, row, bike, swim

            var links = [];
            sourceIds.forEach(function (id) {
                links.push({ from: id, to: 'group-mytral', fromSide: 'bottom', toSide: 'top', accent: true });
            });
            links.push({ from: 'group-import', to: 'group-activities', fromSide: 'bottom', toSide: 'top', letter: 'A' });
            links.push({ from: 'group-activities', to: 'group-ui', fromSide: 'bottom', toSide: 'top', letter: 'A' });

            var built = [];

            function anchor(el, side) {
                var r = el.getBoundingClientRect();
                var c = diagram.getBoundingClientRect();
                var x = r.left + r.width / 2 - c.left;
                var y = (side === 'bottom' ? r.bottom : r.top) - c.top;
                return { x: x, y: y };
            }

            function pathD(a, b) {
                var dy = Math.max(24, (b.y - a.y) * 0.55);
                return 'M ' + a.x + ' ' + a.y +
                    ' C ' + a.x + ' ' + (a.y + dy) + ', ' +
                    b.x + ' ' + (b.y - dy) + ', ' +
                    b.x + ' ' + b.y;
            }

            function buildConnectors() {
                if (window.innerWidth <= 640) {
                    svg.innerHTML = '';
                    built = [];
                    return;
                }
                var c = diagram.getBoundingClientRect();
                svg.setAttribute('width', c.width);
                svg.setAttribute('height', c.height);
                svg.setAttribute('viewBox', '0 0 ' + c.width + ' ' + c.height);

                if (built.length === 0) {
                    svg.innerHTML = '';
                    links.forEach(function (link, idx) {
                        var fromEl = document.getElementById(link.from);
                        var toEl = document.getElementById(link.to);
                        if (!fromEl || !toEl) { return; }
                        var pathId = 'pipe-' + idx;
                        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('class', 'pipe' + (link.accent ? ' accent' : ''));
                        path.setAttribute('id', pathId);
                        svg.appendChild(path);

                        var svgNS = 'http://www.w3.org/2000/svg';
                        var packetCount = 2;
                        var packets = [];
                        for (var p = 0; p < packetCount; p++) {
                            var letter = link.letter || sportLetters[(idx + p) % sportLetters.length];

                            var badge = document.createElementNS(svgNS, 'g');
                            badge.setAttribute('class', 'packet-badge' + (link.accent ? ' badge-accent' : ''));

                            var rect = document.createElementNS(svgNS, 'rect');
                            rect.setAttribute('x', '-7');
                            rect.setAttribute('y', '-7');
                            rect.setAttribute('width', '14');
                            rect.setAttribute('height', '14');
                            rect.setAttribute('rx', '3');
                            badge.appendChild(rect);

                            var text = document.createElementNS(svgNS, 'text');
                            text.setAttribute('x', '0');
                            text.setAttribute('y', '0.5');
                            text.textContent = letter;
                            badge.appendChild(text);

                            svg.appendChild(badge);
                            packets.push({ el: badge, offset: idx * 0.4 + p * 1.6 });
                        }

                        built.push({ link: link, fromEl: fromEl, toEl: toEl, path: path, packets: packets });
                    });
                }

                built.forEach(function (item) {
                    var a = anchor(item.fromEl, item.link.fromSide);
                    var b = anchor(item.toEl, item.link.toSide);
                    var d = pathD(a, b);
                    item.path.setAttribute('d', d);
                });
            }

            var packetLapSeconds = 3.2;

            function animatePackets(nowMs) {
                var nowS = nowMs / 1000;
                built.forEach(function (item) {
                    var total = item.path.getTotalLength();
                    if (!total) { return; }
                    item.packets.forEach(function (packet) {
                        var t = ((nowS + packet.offset) % packetLapSeconds) / packetLapSeconds;
                        var point = item.path.getPointAtLength(t * total);
                        packet.el.setAttribute('transform', 'translate(' + point.x + ',' + point.y + ')');
                    });
                });
                requestAnimationFrame(animatePackets);
            }

            if (!reduceMotion) {
                requestAnimationFrame(animatePackets);
            }

            function pulseFrom(nodeId) {
                built.forEach(function (item) {
                    if (item.link.from === nodeId || item.link.to === nodeId) {
                        item.path.classList.add('hot');
                        setTimeout(function () {
                            item.path.classList.remove('hot');
                        }, 900);
                    }
                });
            }

            var resizeTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(buildConnectors, 120);
            });

            window.addEventListener('load', buildConnectors);
            buildConnectors();

            /* ------------------------------------------------ boot sequence */

            setTimeout(function () {
                typeToTerminal({
                    title: 'mytral --explain-pipeline',
                    detail: 'click any block above to inspect it',
                    file: 'sources -> import -> activities -> ui -> export, all inside mytral, self-hosted on desktop'
                });
            }, 350);
        })();
    </script>
</body>
</html>
