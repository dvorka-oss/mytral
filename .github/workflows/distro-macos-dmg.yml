name: Distro macOS DMG

# build the macOS .dmg only for release pull requests:
#   - source (head) branch must be rel/<major.minor.patch>
#   - target (base) branch must be main
on:
  pull_request:
    branches: [main]

jobs:
  distro-macos-dmg:
    # cheap gate: only run for rel/* head branches targeting main
    if: startsWith(github.head_ref, 'rel/')
    # currently resolves to an Apple Silicon (arm64) runner
    runs-on: macos-latest

    steps:
    - name: Validate release branch name
      run: |
        if [[ ! "${{ github.head_ref }}" =~ ^rel/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Branch '${{ github.head_ref }}' is not a rel/<major.minor.patch> release branch."
          exit 1
        fi
        echo "Release branch '${{ github.head_ref }}' validated."

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Build macOS .dmg
      run: make distro-macos-dmg-build

    - name: Resolve dmg path
      id: dmg
      run: |
        BUNDLE=$(ls distro/macos-dmg/mytral-*.dmg)
        echo "path=${BUNDLE}" >> "$GITHUB_OUTPUT"
        echo "name=$(basename "${BUNDLE}")" >> "$GITHUB_OUTPUT"

    - name: Upload dmg artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.dmg.outputs.name }}
        path: ${{ steps.dmg.outputs.path }}
        if-no-files-found: error
